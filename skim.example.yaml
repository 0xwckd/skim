# skim.yaml: sync only what you need (PROJECT.md §7.5)
network: sepolia
state:
  subscriptions:
    # Account + explicit slots: kept current from every block's BAL, always ready.
    - name: weth
      address: "0xfFf9976782d46CC05630D1f6eBAb18b2324d6B14"
      account: true
      storage: []
    - name: weth-usdc-0.3%
      address: "0x6Ce0896eAE6D4BD668fDe41BB784548fb8F59b50"
      account: true
      storage: ["0x0", "0x4"]        # slot0, liquidity
    # Simulation subscription: the calls' access sets are learned and kept warm;
    # on_block re-runs them every block (latest results via skim_subscriptionStatus).
    - name: my-quoter
      calls:
        - to: "0xEd1f6473345F45b75F8179591dd5bA1888cf2FB3"   # QuoterV2.quoteExactInputSingle(WETH->USDC, 1 WETH, 0.3%)
          data: ""
      on_block: true
  on_demand:
    enabled: true
    cache_ttl_blocks: 4          # unsubscribed state is cached (and kept current) this long
  limits:
    max_subscribed_keys: 100000

# Protocol-aware predictors: fetch what a call will read before running it.
predictors:
  uniswap_v3:
    # quoteExactInputSingle on these pools: predict the tick range a swap of that size reaches,
    # and keep a window around the current tick warm in the background.
    pools:
      - "0x3289680dD4d6C10bb19b899729cda5eEF58AEfF1"   # WETH/USDC 0.05%
      - "0x6Ce0896eAE6D4BD668fDe41BB784548fb8F59b50"   # WETH/USDC 0.3%
      - "0x6418EEC70f50913ff0d756B48d32Ce7C02b47C47"   # WETH/USDC 1%
    words: 2
    prefetch_budget: 256
