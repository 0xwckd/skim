# Uniswap V4 on Sepolia: the native ETH/USDC pool (fee 20 = 0.002%, tickSpacing 1, no hooks).
#
#   skim run --config examples/uniswap-v4/skim.yaml
#
# V4 keeps every pool inside one PoolManager contract, so you don't list storage slots:
# subscribe to the *calls* your app makes. skim learns the PoolManager slots each call reads
# (this pool's slot0, liquidity, tick bitmap, ticks) and keeps exactly those current.
network: sepolia
state:
  subscriptions:
    - name: v4-eth-usdc
      calls:
        # StateView.getSlot0(poolId)
        - to: "0xE1Dd9c3fA50EDB962E442f60DfBc432e24537E4C"
          data: "0xc815641cc743656d27fde4e2d5895e878557aaa56dd48c8656d25e9db35ba10b1fe3d824"
        # V4Quoter.quoteExactInputSingle({poolKey, zeroForOne: true, exactAmount: 0.001 ETH, hookData: 0x})
        - to: "0x61B3f2011A92d183C7dbaDBdA940a7555Ccf9227"
          data: ""
      on_block: true
  on_demand:
    enabled: true
    cache_ttl_blocks: 4
